<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个人副业研究资料看板">
  <title>机会观察室</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#records">跳到资料列表</a>
  <header class="masthead">
    <div>
      <p class="eyebrow">PERSONAL OPPORTUNITY LIBRARY</p>
      <h1>机会观察室</h1>
      <p class="lede">从交流来源到具体证据，保留未知，追踪值得验证的方向。</p>
    </div>
    <div class="phase" aria-live="polite"><span>当前阶段</span><strong id="phase">读取中</strong></div>
  </header>
  <main>
    <section class="metrics" aria-label="资料统计">
      <article><span>来源入口</span><strong id="source-count">—</strong><small id="source-hostname-count">不同 hostname —</small></article>
      <article><span>趋势观察</span><strong id="trend-count">—</strong></article>
      <article><span>点子总数</span><strong id="idea-count">—</strong><small id="idea-status-counts">状态统计读取中</small></article>
      <article><span>精选</span><strong id="selected-count">—</strong><small>当前研究判断</small></article>
    </section>
    <section class="workspace">
      <aside class="filters" aria-label="筛选资料">
        <div class="filter-heading"><h2>筛选</h2><button id="reset" type="button">清除</button></div>
        <label for="search">搜索</label>
        <input id="search" type="search" placeholder="标题、市场、状态…" autocomplete="off">
        <details class="advanced-filters">
          <summary>展开筛选条件</summary>
          <fieldset><legend>资料类型</legend>
            <label><input type="radio" name="kind" value=""> 全部</label>
            <label><input type="radio" name="kind" value="idea" checked> 点子</label>
            <label><input type="radio" name="kind" value="trend"> 趋势</label>
            <label><input type="radio" name="kind" value="source"> 来源</label>
          </fieldset>
          <label for="evidence">证据</label><select id="evidence"><option value="">全部等级</option><option>E0</option><option>E1</option><option>E2</option><option>E3</option></select>
          <label for="research-status">研究状态（点子）</label><select id="research-status"><option value="">全部点子状态</option></select>
          <label for="access-status">访问状态（来源）</label><select id="access-status"><option value="">全部来源状态</option></select>
        </details>
        <p class="privacy-note">当前为只读视图。收藏、忽略与验证反馈将在本机私人状态接入后开放。</p>
      </aside>
      <section class="results" id="records" tabindex="-1">
        <div class="results-heading"><div><p class="eyebrow">RESEARCH RECORDS</p><h2>资料列表</h2></div><p id="result-count" aria-live="polite">读取中…</p></div>
        <div id="record-list" class="record-list" aria-busy="true"></div>
        <div id="empty" class="empty" hidden><strong>没有匹配资料</strong><p>调整搜索词或清除筛选条件。</p></div>
        <div id="error" class="empty error" role="alert" hidden><strong>资料读取失败</strong><p>请确认服务从仓库根目录启动。</p></div>
      </section>
    </section>
  </main>
  <dialog id="detail"><button class="close" type="button" aria-label="关闭详情">×</button><article id="detail-content" class="document"></article></dialog>
</body>
</html>
